name: CI

on:
  pull_request:
  push:
    branches: [main, integration/mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate documentation
        run: python3 scripts/validate_docs.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --exclude sanctumlm-desktop --locked

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/contracts
          - apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Typecheck (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: |
          npm ci
          npm test

  # Full Tauri build / gdk (packaging): deferred — OPEN-009; typecheck runs in `typescript` (TASK-0038).
  desktop:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped — tsc in job typescript; Tauri build deferred (OPEN-009)."
