[package]
name = "sanctumlm-desktop"
version = "0.0.0"
description = "SanctumLM desktop (Tauri 2)"
authors = ["SanctumLM"]
edition = "2021"
publish = false

[lib]
name = "sanctumlm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-domain = { path = "../../../crates/core-domain" }
storage = { path = "../../../crates/storage" }
ai-router = { path = "../../../crates/ai-router" }
retrieval = { path = "../../../crates/retrieval" }
documents-worker = { path = "../../../workers/documents" }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
