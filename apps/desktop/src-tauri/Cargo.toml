[package]
name = "sanctumlm-desktop"
version = "0.0.0"
description = "SanctumLM desktop (Tauri 2)"
authors = ["SanctumLM"]
edition = "2021"
publish = false

[lib]
name = "sanctumlm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
